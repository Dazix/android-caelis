name: Deploy to Google Play

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/deploy.yml'
  release:
    types: [published, prereleased]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Unit tests & Lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Puts sdkmanager on PATH and accepts SDK licences for AGP (android-37.1 / compileSdkMinor = 1)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble, unit-test and lint
        run: >-
          ./gradlew --no-daemon
          :app:assembleDebug
          :app:testDebugUnitTest
          :app:assembleDebugAndroidTest
          :app:lintDebug

      - name: Check the unit-test result XML
        if: success() || failure()
        run: |
          set -eu
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no unit-test result XML at all - the tests did not run" >&2
            exit 1
          fi
          python3 - "${files[@]}" <<'PY'
          import sys, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for path in sys.argv[1:]:
              s = ET.parse(path).getroot()
              tests += int(s.get("tests", 0))
              failures += int(s.get("failures", 0))
              errors += int(s.get("errors", 0))
              skipped += int(s.get("skipped", 0))
          print(f"tests={tests} failures={failures} errors={errors} skipped={skipped}")
          bad = []
          if tests == 0:
              bad.append("no tests ran")
          if failures:
              bad.append(f"{failures} failed")
          if errors:
              bad.append(f"{errors} errored")
          if skipped:
              bad.append(f"{skipped} skipped - a skip is a test that did not answer the question")
          if bad:
              sys.exit("unit tests: " + "; ".join(bad))
          PY

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/
          if-no-files-found: warn

  portability:
    name: Portability gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: No machine-specific or personal values in tracked files
        run: |
          set -eu
          hits=$(git ls-files -z \
            | grep -zv -E '^gradlew(\.bat)?$' \
            | xargs -0 grep -InE '/home/[a-z]|/Users/[a-z]|/snap/|--user [0-9]' \
            | grep -vE '^\.github/workflows/(ci|deploy)\.yml:' || true)
          if [ -n "$hits" ]; then
            echo "$hits" >&2
            echo >&2
            echo "Machine-specific values must not be committed. Put them in scripts/env.local.sh" >&2
            echo "(gitignored) and reference \$ADB / \$JAVA_HOME / \$ANDROID_USER_ID instead." >&2
            exit 1
          fi
          echo "no machine-specific values found"

      - name: The gitignored local configuration is not tracked
        run: |
          set -eu
          tracked=$(git ls-files -- local.properties scripts/env.local.sh .device_snapshot)
          if [ -n "$tracked" ]; then
            echo "these belong to one machine and must stay untracked:" >&2
            echo "$tracked" >&2
            exit 1
          fi
          test -f scripts/env.example.sh || { echo "scripts/env.example.sh is missing - it is the template the scripts point at" >&2; exit 1; }
          echo "local configuration is untracked and the template is present"

  build_and_upload_internal:
    name: Build & Upload to Internal Testing
    if: github.event_name == 'push'
    needs: [validate, portability]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execution permissions to gradlew
        run: chmod +x ./gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: ANDROID_KEYSTORE_BASE64 secret is not configured." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"

      - name: Build Release App Bundle
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          SIGNING_KEY_STORE_PATH: ${{ runner.temp }}/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Upload to Google Play (Internal Testing)
        uses: r0adkll/upload-google-play@a72c1dd77852ec626244f2b1d3d9d300eb030be9 # v1.1.2
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.dazix.caelis
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  promote_internal_to_beta:
    name: Promote Internal to Beta (Open Testing)
    if: github.event_name == 'release' && github.event.release.prerelease == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install --upgrade google-api-python-client google-auth

      - name: Promote Release (internal -> beta)
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          python scripts/promote_release.py \
            --package-name com.dazix.caelis \
            --from-track internal \
            --to-track beta

  promote_beta_to_production:
    name: Promote Beta to Production
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install --upgrade google-api-python-client google-auth

      - name: Promote Release (beta -> production)
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          python scripts/promote_release.py \
            --package-name com.dazix.caelis \
            --from-track beta \
            --to-track production
