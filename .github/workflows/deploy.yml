name: Deploy to Google Play

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/**'
  release:
    types: [published, prereleased]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Unit tests & Lint
    if: github.event_name == 'push' || (github.event_name == 'release' && github.event.release.prerelease == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android-env

      - name: Assemble, unit-test and lint
        run: >-
          ./gradlew --no-daemon
          :app:assembleDebug
          :app:testDebugUnitTest
          :app:assembleDebugAndroidTest
          :app:lintDebug

      - name: Check the unit-test result XML
        if: success() || failure()
        run: python3 scripts/check_test_results.py app/build/test-results/testDebugUnitTest

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-lint-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/
          if-no-files-found: warn

  portability:
    name: Portability gate
    if: github.event_name == 'push' || (github.event_name == 'release' && github.event.release.prerelease == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check repository portability
        run: ./scripts/check_portability.sh

  build_and_upload_internal:
    name: Build & Upload to Internal Testing
    if: github.event_name == 'push'
    needs: [validate, portability]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android-env

      - name: Grant execution permissions to gradlew
        run: chmod +x ./gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: ./scripts/decode_keystore.sh "$RUNNER_TEMP/keystore.jks"

      - name: Set build version variables
        id: vars
        run: ./scripts/set_build_version_vars.sh --track internal --sha "${{ github.sha }}" --run-number "${{ github.run_number }}"

      - name: Build Release App Bundle
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.vars.outputs.version_name }}
          SIGNING_KEY_STORE_PATH: ${{ runner.temp }}/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Upload to Google Play (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.dazix.caelis
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          releaseName: ${{ steps.vars.outputs.release_name }}
          status: completed

  build_and_upload_beta:
    name: Build & Upload to Beta (Open Testing)
    if: github.event_name == 'release' && github.event.release.prerelease == true
    needs: [validate, portability]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android-env

      - name: Grant execution permissions to gradlew
        run: chmod +x ./gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: ./scripts/decode_keystore.sh "$RUNNER_TEMP/keystore.jks"

      - name: Set release candidate version variables
        id: vars
        run: ./scripts/set_build_version_vars.sh --track beta --sha "${{ github.sha }}" --tag "${{ github.event.release.tag_name }}"

      - name: Build Release Candidate Bundle
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.vars.outputs.version_name }}
          SIGNING_KEY_STORE_PATH: ${{ runner.temp }}/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Upload to Google Play (Beta Track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.dazix.caelis
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: beta
          releaseName: ${{ steps.vars.outputs.release_name }}
          status: completed

  promote_beta_to_production:
    name: Promote Beta to Production (Zero Compilation)
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install --upgrade google-api-python-client google-auth

      - name: Set production release variables
        id: vars
        run: ./scripts/set_build_version_vars.sh --track production --sha "${{ github.sha }}" --tag "${{ github.event.release.tag_name }}"

      - name: Promote Release (beta -> production)
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          python scripts/promote_release.py \
            --package-name com.dazix.caelis \
            --from-track beta \
            --to-track production \
            --release-name "${{ steps.vars.outputs.release_name }}" \
            --release-notes "${{ github.event.release.body }}"
