name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the first run's answer worthless, so cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Puts sdkmanager on PATH and accepts the SDK licences, so AGP may download the platform and
      # build-tools it wants. compileSdkMinor = 1 means it needs android-37.1 specifically.
      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble, unit-test and lint
        run: >-
          ./gradlew --no-daemon
          :app:assembleDebug
          :app:testDebugUnitTest
          :app:assembleDebugAndroidTest
          :app:lintDebug

      # The Gradle exit code is not the verdict. Gradle exits 0 when every test skipped itself, and a
      # green run of zero tests is exactly what a broken test setup produces - so the result XML is
      # read and anything other than "all of them ran and all of them passed" fails the job.
      - name: Check the unit-test result XML
        if: success() || failure()
        run: |
          set -eu
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no unit-test result XML at all - the tests did not run" >&2
            exit 1
          fi
          python3 - "${files[@]}" <<'PY'
          import sys, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for path in sys.argv[1:]:
              s = ET.parse(path).getroot()
              tests += int(s.get("tests", 0))
              failures += int(s.get("failures", 0))
              errors += int(s.get("errors", 0))
              skipped += int(s.get("skipped", 0))
          print(f"tests={tests} failures={failures} errors={errors} skipped={skipped}")
          bad = []
          if tests == 0:
              bad.append("no tests ran")
          if failures:
              bad.append(f"{failures} failed")
          if errors:
              bad.append(f"{errors} errored")
          if skipped:
              bad.append(f"{skipped} skipped - a skip is a test that did not answer the question")
          if bad:
              sys.exit("unit tests: " + "; ".join(bad))
          PY

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/
          if-no-files-found: warn

  portability:
    name: portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Machine-specific paths, personal addresses and a hardcoded Android user id were all in the
      # tree once. They are the kind of thing that comes back one careless paste at a time, so the
      # audit that removed them lives here as a gate.
      #
      # gradlew/gradlew.bat are excluded: their JAVA_HOME handling is upstream Gradle boilerplate.
      - name: No machine-specific or personal values in tracked files
        run: |
          set -eu
          hits=$(git ls-files -z \
            | grep -zv -E '^gradlew(\.bat)?$' \
            | xargs -0 grep -InE '/home/[a-z]|/Users/[a-z]|/snap/|--user [0-9]' \
            | grep -vE '^\.github/workflows/ci\.yml:' || true)
          if [ -n "$hits" ]; then
            echo "$hits" >&2
            echo >&2
            echo "Machine-specific values must not be committed. Put them in scripts/env.local.sh" >&2
            echo "(gitignored) and reference \$ADB / \$JAVA_HOME / \$ANDROID_USER_ID instead." >&2
            exit 1
          fi
          echo "no machine-specific values found"

      - name: The gitignored local configuration is not tracked
        run: |
          set -eu
          tracked=$(git ls-files -- local.properties scripts/env.local.sh .device_snapshot)
          if [ -n "$tracked" ]; then
            echo "these belong to one machine and must stay untracked:" >&2
            echo "$tracked" >&2
            exit 1
          fi
          test -f scripts/env.example.sh || { echo "scripts/env.example.sh is missing - it is the template the scripts point at" >&2; exit 1; }
          echo "local configuration is untracked and the template is present"
