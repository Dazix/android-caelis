name: CI

# GitHub bills every job rounded up to a whole minute and the repository is private, so this workflow
# does only what a pull request needs every time. The Android 11 launch has its own workflow
# (api30-launch.yml) that runs only when something it can catch changed, and the release notes and
# portability checks (checks.yml) run on every pull request, Markdown-only ones included.
on:
  pull_request:
    branches: [main]
    # Nothing in the build or the tests reads these: Markdown is documentation only (no test opens a
    # .md file), release-notes/ is checked by checks.yml and the presentation site (site/ and its
    # generator) by pages.yml. A pull request touching nothing else skips the ten-minute build.
    # pages.yml itself is deliberately not listed: WorkflowHardeningTest has to check a changed workflow.
    paths-ignore:
      - '**/*.md'
      - 'release-notes/**'
      - 'LICENSE'
      - 'site/**'
      - 'scripts/build_site.py'
  workflow_dispatch:

# A second push to the same branch makes the first run's answer worthless, so cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Puts JDK, Android SDK (android-37.1) and Gradle on PATH
      - name: Set up Android build environment
        uses: ./.github/actions/setup-android-env

      - name: Assemble, unit-test and lint
        run: >-
          ./gradlew --no-daemon
          :app:assembleDebug
          :app:testDebugUnitTest
          :app:assembleDebugAndroidTest
          :app:lintDebug

      # The Gradle exit code is not the verdict. Gradle exits 0 when every test skipped itself, and a
      # green run of zero tests is exactly what a broken test setup produces - so the result XML is
      # read and anything other than "all of them ran and all of them passed" fails the job.
      - name: Check the unit-test result XML
        if: success() || failure()
        run: python3 scripts/check_test_results.py app/build/test-results/testDebugUnitTest

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/
          if-no-files-found: warn
