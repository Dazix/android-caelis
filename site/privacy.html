<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{a:meta.title}}</title>
  <meta name="description" content="{{a:meta.desc}}">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0E1433">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="{{canonical}}">
{{alternates}}
  <link rel="icon" href="{{root}}assets/img/favicon.ico" sizes="48x48">
  <link rel="icon" href="{{root}}assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="{{root}}assets/css/style.css">
</head>
<body data-lang="{{lang}}" class="legal-page">
  <header class="site-header legal-header">
    <div class="container header-inner">
      <a class="brand" href="{{home}}">
        <img src="{{root}}assets/img/caelis-lockup-horizontal-dark.svg" alt="CAELIS" width="150" height="35">
      </a>
      <details class="lang-picker">
        <summary>
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 6h-2.9a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8ZM12 4a14 14 0 0 1 1.9 4h-3.8A14 14 0 0 1 12 4ZM4.3 14a8.2 8.2 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4H4.3Zm.8 2h2.9a15.7 15.7 0 0 0 1.4 3.6A8 8 0 0 1 5.1 16ZM8 8H5.1a8 8 0 0 1 4.3-3.6A15.7 15.7 0 0 0 8 8Zm4 12a14 14 0 0 1-1.9-4h3.8A14 14 0 0 1 12 20Zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4Zm.3 5.6a15.7 15.7 0 0 0 1.4-3.6h2.9a8 8 0 0 1-4.3 3.6Zm1.7-5.6a16.5 16.5 0 0 0 0-4h3.4a8.2 8.2 0 0 1 0 4h-3.4Z"/></svg>
          <span>{{lang_name}}</span>
        </summary>
        <ul class="lang-menu">
{{lang_links}}
        </ul>
      </details>
    </div>
  </header>

  <main id="main" class="legal container">
    <p class="kicker">{{kicker}}</p>
    <h1>{{title}}</h1>
    <p class="legal-updated">{{updated}}</p>
    <nav class="legal-toc" aria-label="{{a:toc}}">
      <ol>
{{toc_items}}
      </ol>
    </nav>
{{sections}}
    <p class="legal-back"><a href="{{home}}">← {{back}}</a></p>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <img src="{{root}}assets/img/caelis-symbol-dark.svg" width="40" height="40" loading="lazy" alt="">
      <p>© David Šanda · <a href="mailto:dazix.development@gmail.com">dazix.development@gmail.com</a></p>
    </div>
  </footer>
</body>
</html>
